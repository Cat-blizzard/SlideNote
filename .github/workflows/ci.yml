name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llm]"

      - name: Run base test suite
        run: python -m pytest -k "not integration"

  experiment-agent:
    name: Experiment agent pipeline (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/experiment/dsh-backend' || github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llm]"

      - name: Run agent backend tests
        run: python -m pytest tests/test_agent_backend.py -q

      - name: Smoke agent-pack end to end
        run: |
          python - <<'EOF'
          import fitz
          from pathlib import Path
          doc = fitz.open()
          page = doc.new_page(width=360, height=240)
          page.insert_text((40, 60), "Consensus")
          page.insert_text((40, 95), "Quorum reads and writes must overlap.")
          doc.save("smoke.pdf")
          doc.close()
          EOF
          python -m slidenote agent-pack smoke.pdf --out smoke-out --quiet
          python - <<'EOF'
          import json
          manifest = json.load(open("smoke-out/agent_pack/manifest.json", encoding="utf-8"))
          assert manifest["schema_version"] == 1
          assert manifest["sections"], "agent pack must contain sections"
          assert (__import__("pathlib").Path("smoke-out/agent_pack/manifest.json")).exists()
          print("agent-pack smoke OK")
          EOF
